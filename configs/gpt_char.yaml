# Day 5 char-level GPT, sized to train in a few minutes on CPU.
# (configs/gpt_small.yaml is the bigger, GPU-oriented target.)
name: gpt_char
batch_size: 32
block_size: 64
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.1
max_iters: 2000
eval_interval: 200
eval_iters: 100
learning_rate: 0.001
seed: 1337
